<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations - RotNRecs</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">RotNRecs</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/login" class="nav-login">Login</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-container">
            <div class="auth-card" style="max-width: 600px;">
                <h2>Tell us about your favorite movies</h2>
                <p class="auth-subtitle">Add movies you like to get personalized recommendations</p>
                
                <form id="recommendations-form" class="auth-form">
                    <div id="movies-container">
                        <div class="movie-entry">
                            <div class="form-group">
                                <label for="movie-1">Movie Title</label>
                                <div style="position: relative;">
                                    <div style="display: flex; gap: 0.5rem;">
                                        <input type="text" id="movie-1" name="movie" class="movie-input" placeholder="Search for a movie..." autocomplete="off" required>
                                        <button type="button" class="btn-remove" onclick="removeMovie(this)" style="display: none;">Remove</button>
                                    </div>
                                    <div id="movie-1-suggestions" class="movie-suggestions" style="display: none;"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-secondary btn-full" onclick="addMovieField()" style="margin-bottom: 1rem;">
                        + Add Another Movie
                    </button>

                    <div id="error-message" class="error-message" style="display: none;"></div>
                    <div id="success-message" class="success-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary btn-full">Save My Preferences</button>
                </form>
            </div>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script>
        let movieCount = 1;
        let searchTimeouts = {};

        // Setup autocomplete for a movie input
        function setupAutocomplete(inputId) {
            const input = document.getElementById(inputId);
            const suggestionsDiv = document.getElementById(`${inputId}-suggestions`);
            
            if (!input || !suggestionsDiv) return;
            
            input.addEventListener('input', function(e) {
                const query = e.target.value.trim();
                
                // Clear previous timeout
                if (searchTimeouts[inputId]) {
                    clearTimeout(searchTimeouts[inputId]);
                }
                
                if (query.length < 2) {
                    suggestionsDiv.style.display = 'none';
                    return;
                }
                
                // Debounce search
                searchTimeouts[inputId] = setTimeout(() => {
                    searchMovies(query, inputId, suggestionsDiv);
                }, 300);
            });
            
            // Hide suggestions when clicking outside
            document.addEventListener('click', function(e) {
                if (!input.contains(e.target) && !suggestionsDiv.contains(e.target)) {
                    suggestionsDiv.style.display = 'none';
                }
            });
        }
        
        // Search for movies using TMDB API
        async function searchMovies(query, inputId, suggestionsDiv) {
            try {
                const response = await fetch(`http://localhost:8000/api/search-movies?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    displaySuggestions(data.results, inputId, suggestionsDiv);
                } else {
                    suggestionsDiv.style.display = 'none';
                }
            } catch (error) {
                console.error('Error searching movies:', error);
                suggestionsDiv.style.display = 'none';
            }
        }
        
        // Display movie suggestions
        function displaySuggestions(movies, inputId, suggestionsDiv) {
            suggestionsDiv.innerHTML = '';
            
            movies.forEach(movie => {
                const item = document.createElement('div');
                item.className = 'movie-suggestion-item';
                item.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem;">
                        ${movie.poster_path ? 
                            `<img src="https://image.tmdb.org/t/p/w92${movie.poster_path}" alt="${movie.title}" style="width: 46px; height: 69px; object-fit: cover; border-radius: 4px;">` :
                            `<div style="width: 46px; height: 69px; background: #e5e7eb; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 0.75rem;">No Image</div>`
                        }
                        <div style="flex: 1;">
                            <div style="font-weight: 500; color: #1f2937;">${movie.title}</div>
                            ${movie.release_date ? `<div style="font-size: 0.875rem; color: #6b7280;">${movie.release_date.split('-')[0]}</div>` : ''}
                        </div>
                    </div>
                `;
                
                item.addEventListener('click', function() {
                    document.getElementById(inputId).value = movie.title;
                    suggestionsDiv.style.display = 'none';
                });
                
                suggestionsDiv.appendChild(item);
            });
            
            suggestionsDiv.style.display = 'block';
        }
        
        // Setup autocomplete for the first input on page load
        document.addEventListener('DOMContentLoaded', function() {
            setupAutocomplete('movie-1');
        });

        function addMovieField() {
            movieCount++;
            const container = document.getElementById('movies-container');
            const newEntry = document.createElement('div');
            newEntry.className = 'movie-entry';
            newEntry.innerHTML = `
                <div class="form-group">
                    <label for="movie-${movieCount}">Movie Title</label>
                    <div style="position: relative;">
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="movie-${movieCount}" name="movie" class="movie-input" placeholder="Search for a movie..." autocomplete="off" required>
                            <button type="button" class="btn-remove" onclick="removeMovie(this)">Remove</button>
                        </div>
                        <div id="movie-${movieCount}-suggestions" class="movie-suggestions" style="display: none;"></div>
                    </div>
                </div>
            `;
            container.appendChild(newEntry);
            
            // Add autocomplete to the new input
            setupAutocomplete(`movie-${movieCount}`);
            
            // Show remove buttons on all entries if there's more than one
            updateRemoveButtons();
        }

        function removeMovie(button) {
            const entry = button.closest('.movie-entry');
            entry.remove();
            updateRemoveButtons();
        }

        function updateRemoveButtons() {
            const entries = document.querySelectorAll('.movie-entry');
            entries.forEach((entry, index) => {
                const removeBtn = entry.querySelector('.btn-remove');
                if (entries.length > 1) {
                    removeBtn.style.display = 'block';
                } else {
                    removeBtn.style.display = 'none';
                }
            });
        }

        document.getElementById('recommendations-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const movies = Array.from(document.querySelectorAll('.movie-input'))
                .map(input => input.value.trim())
                .filter(movie => movie.length > 0);
            
            if (movies.length === 0) {
                showError('Please add at least one movie');
                return;
            }

            // TODO: Send movies to backend API
            console.log('Movies to save:', movies);
            showSuccess(`Successfully saved ${movies.length} movie(s)!`);
            
            // Reset form after a delay
            setTimeout(() => {
                document.getElementById('recommendations-form').reset();
                movieCount = 1;
                const container = document.getElementById('movies-container');
                container.innerHTML = `
                    <div class="movie-entry">
                        <div class="form-group">
                            <label for="movie-1">Movie Title</label>
                            <div style="position: relative;">
                                <div style="display: flex; gap: 0.5rem;">
                                    <input type="text" id="movie-1" name="movie" class="movie-input" placeholder="Search for a movie..." autocomplete="off" required>
                                    <button type="button" class="btn-remove" onclick="removeMovie(this)" style="display: none;">Remove</button>
                                </div>
                                <div id="movie-1-suggestions" class="movie-suggestions" style="display: none;"></div>
                            </div>
                        </div>
                    </div>
                `;
                // Re-setup autocomplete for the reset input
                setupAutocomplete('movie-1');
            }, 2000);
        });

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }
    </script>
</body>
</html>
